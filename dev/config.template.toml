schema_version = 4

# Ollama runs on the host. This is an endpoint, not a bearer credential.
[providers.models.ollama.default]
model = "llama3.2"
uri = "http://host.docker.internal:11434"
temperature = 0.7

[agents.default]
enabled = true
model_provider = "ollama.default"
risk_profile = "default"
runtime_profile = "default"

[agents.default.workspace]
path = "/zeroclaw-data/workspace"

[risk_profiles.default]

[runtime_profiles.default]

[gateway]
port = 42617
host = "[::]"
allow_public_bind = true
require_pairing = false
# Optional static "master" pairing code (recovery credential). When set, submitting
# this exact value on the pairing page (or to POST /api/pair / POST /pair) logs the
# device in WITHOUT consuming the one-time startup/rotation code. Reusable static
# secret — prefer a long high-entropy value and treat it like a password. Never
# printed to the banner or logs. Inert when require_pairing = false.
# master_pair_code = "replace-with-a-long-random-recovery-code"
web_dist_dir = "/usr/share/zeroclawlabs/web/dist"
# Send WebSocket keepalive pings every 30 seconds; set to 0 to disable.
# Applied when each chat WebSocket opens; reconnect clients after changing it.
websocket_ping_interval_secs = 30
# After Stop/Abort, force-drop a stuck turn after this many seconds (0 = use default 5).
turn_cancel_after = 5
# Finish an OpenAI-compatible SSE stream after this many seconds without a
# meaningful data: event. SSE comments (: ping) do not refresh the timer (0 = use default 60).
sse_app_idle_secs = 60

# Built-in tool selection: ["*"] is full, the default; [] is minimal.
[tools]
optional = ["*"]

# Cost tracking and budget enforcement configuration
# Enable to track API usage costs and enforce spending limits
[cost]
enabled = false
daily_limit_usd = 10.0
monthly_limit_usd = 100.0
warn_at_percent = 80
allow_override = false

# Per-model pricing (USD per 1M tokens)
# Uncomment and customize to override default pricing
# [cost.prices."anthropic/claude-sonnet-4-20250514"]
# input = 3.0
# output = 15.0
#
# [cost.prices."openai/gpt-4o"]
# input = 5.0
# output = 15.0
